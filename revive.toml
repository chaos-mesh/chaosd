ignore-generated-header = false
severity = "error"
confidence = 0.8
error-code = 1
warning-code = 0

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.errorf]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unreachable-code]
[rule.var-declaration]
[rule.var-naming]

# Comments are reviewed for useful behavior contracts, not required on every symbol.
[rule.exported]
disabled = true
[rule.package-comments]
disabled = true

[rule.unused-parameter]

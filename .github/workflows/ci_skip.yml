name: ci
on:
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/ci_skip.yml
      - Makefile
      - Dockerfile
      - .dockerignore
      - 'images/**'
      - 'hack/**'
      - go.*
      - "**.go"

jobs:
  pull:
    strategy:
      matrix:
        arch: [amd64, arm64]
        job:
          - verify
          - build
          - unit-test
          - integration-test
    runs-on: ubuntu-latest

    steps:
      - run: echo "Not required to run pull jobs."

name: Release tag binary

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release_latest.yml
      - .github/workflows/release_tag.yml
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  run:
    name: Release tag (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build binary and related tools
        run: make build
      - name: Validate release binaries and runner tools
        run: |
          python3 --version
          aws --version
          ./bin/chaosd --help
          ./bin/chaosd version
          readelf --version-info bin/chaosd bin/tools/FileTool bin/tools/PortOccupyTool
      - name: Upload files
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          package="chaosd-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mv bin "$package"
          tar czf "$package.tar.gz" "$package"
          aws s3 cp "$package.tar.gz" "$AWS_BUCKET_NAME/$package.tar.gz"

name: Release latest binary

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run:
    name: Upload
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    container: rockylinux:8
    timeout-minutes: 45
    steps:
      - name: Prepare build tools
        run: dnf install -y make gcc git tar gzip curl python3.12 python3.12-pip
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust workspace for Git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build binary and related tools
        run: make build
      - name: Install AWS CLI
        run: python3.12 -m pip install --upgrade awscli
      - name: Upload files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          package="chaosd-latest-linux-${{ matrix.arch }}"
          mv bin "$package"
          tar czf "$package.tar.gz" "$package"
          aws s3 cp "$package.tar.gz" "$AWS_BUCKET_NAME/$package.tar.gz"

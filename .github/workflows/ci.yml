name: ci

on:
  pull_request:
    branches:
      - main
      - release-*
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        job: [verify, build, unit-test, integration-test]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.20.x
          cache-dependency-path: go.sum
      - name: Install integration prerequisites
        if: matrix.job == 'integration-test'
        run: |
          sudo apt-get update
          sudo apt-get install -y ipset iptables iproute2 net-tools iperf stress-ng
      - name: Install verification prerequisites
        if: matrix.job == 'verify'
        run: |
          sudo apt-get update
          sudo apt-get install -y python-is-python3
      - name: Verify
        if: matrix.job == 'verify'
        run: |
          make check
          git diff --exit-code
      - name: Build
        if: matrix.job == 'build'
        run: make build
      - name: Unit tests
        if: matrix.job == 'unit-test'
        run: make unit-test
      - name: Integration tests
        if: matrix.job == 'integration-test'
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOPATH=$(go env GOPATH)" make integration-test

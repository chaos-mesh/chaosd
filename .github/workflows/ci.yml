name: ci

on:
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/ci_skip.yml
      - Makefile
      - Dockerfile
      - .dockerignore
      - 'images/**'
      - 'hack/**'
      - go.*
      - '**.go'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        job: [verify, build, unit-test, integration-test]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cache integration downloads
        if: matrix.job == 'integration-test'
        uses: actions/cache@v6
        with:
          path: ~/.cache/chaosd
          key: ${{ runner.os }}-${{ matrix.arch }}-chaosd-downloads-v1-${{ hashFiles('hack/dependency-versions.sh') }}
      - name: Cache Maven dependencies
        if: matrix.job == 'integration-test'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.arch }}-maven-v1-${{ hashFiles('hack/dependency-versions.sh', 'test/integration_test/jvm/run.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-maven-v1-
      - name: Install integration prerequisites
        if: matrix.job == 'integration-test'
        run: |
          sudo apt-get update
          sudo apt-get install -y ipset iptables iproute2 net-tools iperf stress-ng
      - name: Install verification prerequisites
        if: matrix.job == 'verify'
        run: |
          sudo apt-get update
          sudo apt-get install -y python-is-python3
      - name: Verify
        if: matrix.job == 'verify'
        run: |
          make check
          git diff --exit-code
      - name: Build and verify runtime image
        if: matrix.job == 'build'
        run: |
          make image-chaosd
          bash hack/verify-image.sh chaosd:latest
      - name: Unit tests
        if: matrix.job == 'unit-test'
        run: make unit-test
      - name: Integration tests
        if: matrix.job == 'integration-test'
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOPATH=$(go env GOPATH)" \
            "CHAOSD_TOOLS_CACHE=$HOME/.cache/chaosd" "MAVEN_REPO_LOCAL=$HOME/.m2/repository" make integration-test
